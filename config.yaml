# Call constants for scripts/trace_extract.py (Phase 1)
model_id: gemma3:4b
model_url: http://localhost:11434
provider: OllamaLanguageModel

# Stored for later phases; not printed in Phase 1
empty_parse_message: >
  Chunk omitted on parse or schema error; raw model text is kept above.

# Printed under [parse] when the model returned a valid empty extraction list
empty_list_message: >
  Model returned a valid empty extraction list; nothing was omitted.

# Align-side marker for extractions Resolver.align could not ground
ungrounded_label: ungrounded

# Printed beside the token/char offsets under [align]
chunk_offset_caption: chunk start in the document

# Document file for the one live lx.extract call (repo-relative path)
document_path: data/example_document.md

# Chunking for lx.extract. Raised above example_document.md (~33k chars) so the
# live run stays one chunk / one Ollama infer (RUN-03).
max_char_buffer: 40000
context_window_chars: 200

# Prompt description for the live call
prompt_description: >
  Extract coding rules as single sentences as bullet points about code style, review process,
  or deduplication. Use extraction_class coding_rule. Use the exact wording
  from the source for each extraction_text.

# One few-shot example for the live call; texts appear verbatim in its text
examples:
  - text: >
      Keep SKILL.md under 500 lines. Do not ask the LLM to check what a tool
      can verify. Flag duplicated knowledge at the second copy.
    extractions:
      - extraction_class: coding_rule
        extraction_text: Keep SKILL.md under 500 lines.
      - extraction_class: coding_rule
        extraction_text: Do not ask the LLM to check what a tool can verify.
      - extraction_class: coding_rule
        extraction_text: Flag duplicated knowledge at the second copy.

# Seconds to wait for GET /api/tags before the live call
preflight_timeout_s: 5

# Seconds for the single /api/generate request (cold model load can be slow)
request_timeout_s: 300

redact_keys:
  - api_key
  - apikey
  - token
  - secret
  - password
  - authorization
  - bearer
  - jwt
